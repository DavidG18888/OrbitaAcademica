<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Matrículas')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('matriculas')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Matrículas')}"></header>
        <th:block th:replace="~{fragments :: avisos}"></th:block>

        <section class="box">
            <h3>Matricular estudiante</h3>
            <form method="post" action="/admin/matriculas/guardar" class="form-grid">
                <label><span>Estudiante</span>
                    <select name="estudiante_id" required>
                        <option value="">Seleccione</option>
                        <option th:each="e : ${estudiantes}" th:value="${e.id}" th:text="${e.nombre}"></option>
                    </select></label>
                <label><span>Sección (matriculados/cupo)</span>
                    <select name="seccion_id" required>
                        <option value="">Seleccione</option>
                        <option th:each="s : ${secciones}" th:value="${s.id}" th:text="${s.nombre}"></option>
                    </select></label>
                <div class="form-actions"><button class="btn" type="submit">Matricular</button></div>
            </form>
        </section>

        <section class="box">
            <div class="box-head">
                <h3>Matrículas registradas</h3>
                <form method="get" action="/admin/matriculas" class="filtro">
                    <select name="periodo" onchange="this.form.submit()">
                        <option value="">Todos los períodos</option>
                        <option th:each="p : ${periodos}" th:value="${p.id}" th:text="${p.nombre}" th:selected="${p.id == periodo}"></option>
                    </select>
                </form>
            </div>
            <div class="scroll">
                <table class="tabla">
                    <thead><tr><th>Código</th><th>Estudiante</th><th>Sección</th><th>Asignatura</th><th>Período</th><th>Docente</th><th>Fecha</th><th>Estado</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="f : ${filas}">
                        <td th:text="${f.codigo}"></td>
                        <td th:text="${f.estudiante}"></td>
                        <td th:text="${f.seccion}"></td>
                        <td th:text="${f.asignatura}"></td>
                        <td th:text="${f.periodo}"></td>
                        <td th:text="${f.docente}"></td>
                        <td th:text="${f.fecha}"></td>
                        <td><span class="pill" th:classappend="${f.estado == 'ACTIVA'} ? 'ok' : 'warn'" th:text="${f.estado}"></span></td>
                        <td class="acc">
                            <form method="post" th:action="@{/admin/matriculas/{id}/retirar(id=${f.id})}">
                                <button type="submit" class="neutro" th:text="${f.estado == 'ACTIVA'} ? 'Retirar' : 'Reactivar'"></button></form>
                            <form method="post" th:action="@{/admin/matriculas/{id}/eliminar(id=${f.id})}" onsubmit="return confirm('Se eliminarán también sus notas y asistencia. ¿Continuar?')">
                                <button type="submit">Eliminar</button></form>
                        </td>
                    </tr>
                    <tr th:if="${filas.isEmpty()}"><td class="muted">No hay matrículas.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
