<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Soporte')}"></head><body><div class="app"><aside th:replace="~{fragments :: side('soporte')}"></aside><main class="main"><header th:replace="~{fragments :: top('Soporte y evaluaciones')}"></header><th:block th:replace="~{fragments :: avisos}"></th:block><section class="hero"><div><h2>Estamos para ayudarte</h2><p>Abre solicitudes, da seguimiento y evalúa a tus catedráticos.</p></div></section><section class="box"><h3>Crear ticket</h3><form method="post" action="/estudiante/servicios/ticket" class="form-grid"><label><span>Asunto</span><input name="asunto" required maxlength="160"></label><label><span>Categoría</span><select name="categoria"><option>Académico</option><option>Pagos</option><option>Matrícula</option><option>Documentos</option><option>Acceso al portal</option><option>Otro</option></select></label><label class="wide"><span>Descripción</span><textarea name="descripcion" required rows="3"></textarea></label><button class="btn">Enviar solicitud</button></form></section><section class="box"><h3>Mis tickets</h3><article th:each="t:${tickets}" class="subcard"><b th:text="${t.asunto}"></b> · <span th:text="${t.estado}"></span><p th:text="${t.descripcion}"></p><div th:each="r:${t.respuestas}"><small th:text="${r.usuario}"></small><p th:text="${r.mensaje}"></p></div><form method="post" th:action="@{/estudiante/servicios/ticket/{id}/respuesta(id=${t.id})}" class="inline"><input name="mensaje" placeholder="Escribe una respuesta" required><button class="btn">Responder</button></form></article><p th:if="${tickets.isEmpty()}" class="muted">No tienes solicitudes abiertas.</p></section><section class="box"><h3>Evaluar catedráticos</h3><form th:each="e:${evaluables}" method="post" action="/estudiante/servicios/evaluacion" class="form-grid subcard"><input type="hidden" name="seccionId" th:value="${e.seccion_id}"><input type="hidden" name="docenteId" th:value="${e.docente_id}"><b th:text="${e.asignatura+' · '+e.docente}"></b><label><span>Calificación</span><select name="puntuacion"><option value="5">5 - Excelente</option><option value="4">4 - Muy bueno</option><option value="3">3 - Bueno</option><option value="2">2 - Regular</option><option value="1">1 - Deficiente</option></select></label><label><span>Comentario opcional</span><input name="comentario" maxlength="1000"></label><button class="btn">Enviar evaluación confidencial</button></form><p th:if="${evaluables.isEmpty()}" class="muted">No hay evaluaciones pendientes.</p></section><section class="box"><h3>Calendario institucional</h3><div th:each="ev:${eventos}" class="subcard"><b th:text="${ev.titulo}"></b><p th:text="${ev.fecha_inicio+' — '+ev.fecha_fin}"></p><p th:text="${ev.descripcion}"></p></div></section><section class="box"><h3>Notificaciones</h3><div th:each="n:${notificaciones}" class="subcard"><b th:text="${n.titulo}"></b><p th:text="${n.mensaje}"></p></div></section></main></div></body></html>
