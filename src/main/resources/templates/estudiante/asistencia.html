<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Asistencia')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('asistencia')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Mi asistencia')}"></header>
        <section class="box">
            <h3>Por asignatura</h3>
            <div class="scroll">
                <table class="tabla">
                    <thead><tr><th>Asignatura</th><th>Clases registradas</th><th>Asistidas</th><th>Asistencia</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${actuales}">
                        <td th:text="${r.asignatura}"></td><td th:text="${r.clases}"></td><td th:text="${r.asistidas}"></td>
                        <td><div class="barra inline"><i th:style="'width:' + (${r.asist} ?: 0) + '%'"></i></div>
                            <b th:text="${r.asist != null} ? ${r.asist} + '%' : '—'"></b></td>
                    </tr>
                    <tr th:if="${actuales.isEmpty()}"><td class="muted">Sin asignaturas en curso.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
        <section class="box">
            <h3>Ausencias y justificaciones recientes</h3>
            <p class="muted" th:if="${incidencias.isEmpty()}">No tiene ausencias registradas.</p>
            <table class="tabla" th:if="${!incidencias.isEmpty()}">
                <thead><tr><th>Fecha</th><th>Asignatura</th><th>Registro</th></tr></thead>
                <tbody>
                <tr th:each="i : ${incidencias}">
                    <td th:text="${i.fecha}"></td><td th:text="${i.asignatura}"></td>
                    <td><span class="pill" th:classappend="${i.estado == 'J'} ? 'warn' : 'bad'" th:text="${i.estado == 'J'} ? 'Justificada' : 'Ausente'"></span></td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
