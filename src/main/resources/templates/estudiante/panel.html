<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Inicio')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('inicio')}"></aside>
    <main class="main">
<button type="button" class="print-icon no-print" title="Imprimir constancia de matrícula" aria-label="Imprimir constancia" onclick="openJasperViewer('/estudiante/constancia')">&#128424;</button>
        <header th:replace="~{fragments :: top('Portal estudiantil')}"></header>
        <section th:replace="~{fragments :: hero(${saludo}, ${sub})}"></section>

        <section class="rings">
            <div th:replace="~{fragments :: ring(${pProm}, ${tProm}, 'Promedio general')}"></div>
            <div th:replace="~{fragments :: ring(${pAsist}, ${tAsist}, 'Asistencia del período')}"></div>
            <div class="ring-box"><div class="ring-wrap plain"><b th:text="${actuales.size()}">0</b></div><small>Asignaturas en curso</small></div>
            <div class="ring-box"><div class="ring-wrap plain"><b th:text="${uv}">0</b></div><small>Unidades valorativas</small></div>
        </section>

        <section class="content-grid">
            <article class="box">
                <h3>Clases de hoy</h3>
                <p class="muted" th:if="${hoy.isEmpty()}">No tiene clases programadas hoy.</p>
                <ul class="agenda">
                    <li th:each="c : ${hoy}">
                        <b th:text="${c.hora_inicio} + ' – ' + ${c.hora_fin}"></b>
                        <span th:text="${c.asignatura}"></span>
                        <small th:text="${c.aula} ?: 'Aula por definir'"></small>
                    </li>
                </ul>
            </article>
            <article class="box">
                <h3>Mis asignaturas</h3>
                <ul class="agenda">
                    <li th:each="r : ${actuales}">
                        <span th:text="${r.asignatura}"></span>
                        <small th:text="${r.docente} ?: 'Docente por asignar'"></small>
                        <span class="pill" th:classappend="${r.clase}" th:text="${r.promedio} ?: 'En curso'"></span>
                    </li>
                </ul>
                <p class="muted" th:if="${actuales.isEmpty()}">Todavía no tiene asignaturas matriculadas.</p>
            </article>
        </section>
    </main>
</div>
</body>
</html>
