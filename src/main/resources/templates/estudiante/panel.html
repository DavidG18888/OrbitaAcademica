<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mis asignaturas y notas')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('estudiante')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Mis asignaturas y notas')}"></header>
        <section class="box">
            <div class="scroll">
                <table class="tabla">
                    <thead><tr><th>Código</th><th>Asignatura</th><th>Sección</th><th>Período</th><th>Horario</th><th>P1</th><th>P2</th><th>P3</th><th>Promedio</th><th>Estado</th></tr></thead>
                    <tbody>
                    <tr th:each="d : ${datos}">
                        <td th:text="${d.codigo}"></td>
                        <td th:text="${d.asignatura}"></td>
                        <td th:text="${d.seccion}"></td>
                        <td th:text="${d.periodo}"></td>
                        <td th:text="${d.dia} + ' ' + ${d.hora_inicio} + '–' + ${d.hora_fin}"></td>
                        <td th:text="${d.parcial1} ?: '—'"></td>
                        <td th:text="${d.parcial2} ?: '—'"></td>
                        <td th:text="${d.parcial3} ?: '—'"></td>
                        <td><strong th:text="${d.promedio} ?: '—'"></strong></td>
                        <td th:text="${d.promedio == null} ? 'En curso' : (${T(java.lang.Double).parseDouble(d.promedio) >= 65} ? 'Aprobada' : 'Reprobada')"></td>
                    </tr>
                    <tr th:if="${datos.isEmpty()}"><td class="muted">Todavía no tiene asignaturas matriculadas.</td></tr>
                    </tbody>
                </table>
            </div>
            <p class="muted">Nota mínima aprobatoria: 65. El promedio se calcula cuando los tres parciales están registrados.</p>
        </section>
    </main>
</div>
</body>
</html>
