<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Calificaciones')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('calificaciones')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Mis calificaciones')}"></header>
        <section class="box">
            <div class="box-head">
                <h3>Período actual</h3>
                <button type="button" class="print-icon no-print" title="Imprimir historial" onclick="openJasperViewer('/estudiante/historial/imprimir')">🖨 Imprimir PDF</button>
            </div>
            <div class="scroll">
                <table class="tabla">
                    <thead><tr><th>Código</th><th>Asignatura</th><th>Parcial I /25</th><th>Parcial II /35</th><th>Parcial III /40</th><th>Promedio</th><th>Estado</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${actuales}">
                        <td th:text="${r.codigo}"></td>
                        <td><strong th:text="${r.asignatura}"></strong></td>
                        <td th:text="${r.parcial1} ?: '—'"></td>
                        <td th:text="${r.parcial2} ?: '—'"></td>
                        <td th:text="${r.parcial3} ?: '—'"></td>
                        <td><strong th:text="${r.promedio} ?: '—'"></strong></td>
                        <td><span class="pill" th:classappend="${r.clase}" th:text="${r.estado}"></span></td>
                    </tr>
                    <tr th:if="${actuales.isEmpty()}"><td colspan="7" class="muted">Todavía no tiene asignaturas matriculadas.</td></tr>
                    </tbody>
                </table>
            </div>
            <p class="muted" style="margin-top:12px">Nota mínima aprobatoria: 70 puntos (Parcial I: 25, Parcial II: 35, Parcial III: 40).</p>
        </section>
    </main>
</div>
<th:block th:replace="~{fragments :: printViewer}"></th:block>
<th:block th:replace="~{fragments :: printScript}"></th:block>
</body>
</html>
