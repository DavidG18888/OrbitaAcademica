<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Calificaciones')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('calificaciones')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Mis calificaciones')}"></header>
        <section class="box">
            <div class="box-head">
                <h3>Período actual</h3>
                <a class="btn ghost no-print" href="/estudiante/historial/imprimir" target="_blank">Imprimir historial con Jasper</a>
            </div>
            <div class="scroll">
                <table class="tabla">
                    <thead><tr><th>Código</th><th>Asignatura</th><th>Parcial 1</th><th>Parcial 2</th><th>Parcial 3</th><th>Promedio</th><th>Estado</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${actuales}">
                        <td th:text="${r.codigo}"></td><td th:text="${r.asignatura}"></td>
                        <td th:text="${r.parcial1} ?: '—'"></td><td th:text="${r.parcial2} ?: '—'"></td><td th:text="${r.parcial3} ?: '—'"></td>
                        <td><strong th:text="${r.promedio} ?: '—'"></strong></td>
                        <td><span class="pill" th:classappend="${r.clase}" th:text="${r.estado}"></span></td>
                    </tr>
                    <tr th:if="${actuales.isEmpty()}"><td class="muted">Todavía no tiene asignaturas matriculadas.</td></tr>
                    </tbody>
                </table>
            </div>
            <p class="muted">Nota mínima aprobatoria: 65. El promedio se calcula cuando los tres parciales están registrados.</p>
        </section>
    </main>
</div>
</body>
</html>
