<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Mi expediente')}"></head><body><div class="app"><aside th:replace="~{fragments :: side('documentos')}"></aside><main class="main"><header th:replace="~{fragments :: top('Mi expediente digital')}"></header><th:block th:replace="~{fragments :: avisos}"></th:block><section class="hero"><div><h2>Tus documentos académicos</h2><p>Carga cada documento por separado y consulta su estado de revisión.</p></div></section><section class="grid-cards"><article class="box" th:each="item : ${ {'TITULO_GRADUACION','PARTIDA_NACIMIENTO','DNI'} }"><h3 th:text="${item == 'TITULO_GRADUACION' ? 'Título de graduación' : (item == 'PARTIDA_NACIMIENTO' ? 'Partida de nacimiento' : 'Documento de Identidad Nacional (DNI)')}"></h3><p class="muted" th:text="${item == 'PARTIDA_NACIMIENTO' ? 'PDF oficial obtenido desde las plataformas del Gobierno.' : 'Documento PDF. Asegúrate de incluir ambos lados cuando corresponda.'}"></p><form method="post" action="/estudiante/servicios/documento" enctype="multipart/form-data"><input type="hidden" name="tipo" th:value="${item}"><label><span>Seleccionar PDF</span><input type="file" name="archivo" accept="application/pdf,.pdf" required></label><button class="btn">Cargar documento</button></form><div th:each="d:${documentos}" th:if="${d.tipo == item}" class="subcard"><b th:text="${d.nombre_archivo}"></b><p><span class="pill" th:text="${d.estado}"></span></p><p th:text="${d.observacion}"></p><a th:href="@{/archivo-privado/documento/{id}(id=${d.id})}">Ver documento</a></div></article></section><section class="box"><h3>Fotografía de perfil</h3><form method="post" action="/estudiante/servicios/foto" enctype="multipart/form-data" class="form-grid"><label><span>Fotografía JPG o PNG</span><input type="file" name="archivo" accept="image/jpeg,image/png" required></label><button class="btn">Actualizar fotografía</button></form></section></main></div></body></html>
