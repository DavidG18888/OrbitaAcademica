<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mi expediente')}"></head>
<body>
<div class="app">
<aside th:replace="~{fragments :: side('documentos')}"></aside>
<main class="main">
<header th:replace="~{fragments :: top('Mi expediente digital')}"></header>
<th:block th:replace="~{fragments :: avisos}"></th:block>
<section class="hero"><div><h2>Tus documentos académicos</h2><p>Carga cada documento por separado y consulta su estado de revisión.</p></div></section>
<style>
.document-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:22px 0}
.document-card{display:flex;flex-direction:column;gap:12px;min-width:0}
.document-card .doc-description{min-height:48px}
.file-picker{display:flex;flex-direction:column;gap:8px}
.file-picker input[type=file]{display:block;width:100%;max-width:100%;padding:11px;border:1px solid #dbe3ef;border-radius:10px;background:#fff;font-size:13px}
.document-card form{display:flex;flex-direction:column;gap:10px}
.document-card form .btn{align-self:flex-start;min-height:42px;padding:10px 18px}
.doc-record{margin-top:auto;border:1px solid #dbe3ef;border-radius:12px;padding:13px;background:#fbfcfe;overflow-wrap:anywhere}
.doc-record .pill{display:inline-block;margin:7px 0}
.profile-upload{display:flex;align-items:end;gap:14px;flex-wrap:wrap}
.profile-upload label{display:flex;flex-direction:column;gap:8px}
.profile-upload input[type=file]{padding:10px;border:1px solid #dbe3ef;border-radius:9px;max-width:100%}
@media(max-width:900px){.document-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.document-grid{grid-template-columns:1fr}.document-card .doc-description{min-height:0}.profile-upload{align-items:stretch;flex-direction:column}}
</style>
<section class="document-grid">
<article class="box document-card" th:each="item : ${ {'TITULO_GRADUACION','PARTIDA_NACIMIENTO','DNI'} }">
<div>
<h3 th:text="${item == 'TITULO_GRADUACION' ? 'Título de graduación' : (item == 'PARTIDA_NACIMIENTO' ? 'Partida de nacimiento' : 'Documento de Identidad Nacional (DNI)')}"></h3>
<p class="muted doc-description" th:text="${item == 'PARTIDA_NACIMIENTO' ? 'PDF oficial obtenido desde las plataformas del Gobierno.' : 'Documento PDF. Incluye ambos lados cuando corresponda.'}"></p>
</div>
<form method="post" action="/estudiante/servicios/documento" enctype="multipart/form-data">
<input type="hidden" name="tipo" th:value="${item}">
<label class="file-picker"><strong>1. Selecciona tu archivo PDF</strong><input type="file" name="archivo" accept="application/pdf,.pdf" required></label>
<button class="btn" type="submit"><span aria-hidden="true">↑</span> 2. Cargar documento</button>
</form>
<div th:each="d:${documentos}" th:if="${d.tipo == item}" class="doc-record">
<strong th:text="${d.nombre_archivo}"></strong>
<p><span class="pill" th:text="${d.estado}"></span></p>
<p class="muted" th:if="${d.observacion != null and !#strings.isEmpty(d.observacion)}" th:text="${d.observacion}"></p>
<a th:href="@{/archivo-privado/documento/{id}(id=${d.id})}" target="_blank" rel="noopener">Ver documento</a>
</div>

</article>
</section>
<section class="box">
<h3>Fotografía de perfil</h3>
<form method="post" action="/estudiante/servicios/foto" enctype="multipart/form-data" class="profile-upload">
<label><strong>Selecciona una fotografía JPG o PNG</strong><input type="file" name="archivo" accept="image/jpeg,image/png" required></label>
<button class="btn" type="submit">Actualizar fotografía</button>
</form>
</section>
</main></div></body></html>
