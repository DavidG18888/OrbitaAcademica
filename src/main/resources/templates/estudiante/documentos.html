<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mi expediente')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('documentos')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Mi expediente digital')}"></header>
        <th:block th:replace="~{fragments :: avisos}"></th:block>

        <section class="hero">
            <div>
                <h2>Tus documentos académicos</h2>
                <p>Una vez cargado un documento, queda bloqueado para edición del estudiante. Únicamente la administración puede modificar o actualizar su estado.</p>
            </div>
        </section>

        <section class="cards">
            <article class="card" th:each="item : ${ {'TITULO_GRADUACION','PARTIDA_NACIMIENTO','DNI'} }"
                     th:with="doc=${porTipo.get(item)}">
                <small th:text="${item == 'TITULO_GRADUACION' ? 'REQUISITO DE INGRESO' : (item == 'PARTIDA_NACIMIENTO' ? 'DOCUMENTO OFICIAL RNP' : 'IDENTIFICACIÓN NACIONAL')}"></small>
                <h3 th:text="${item == 'TITULO_GRADUACION' ? 'Título de graduación' : (item == 'PARTIDA_NACIMIENTO' ? 'Partida de nacimiento' : 'Documento Nacional de Identidad (DNI)')}"></h3>
                <p class="muted" th:text="${item == 'PARTIDA_NACIMIENTO' ? 'PDF oficial emitido por las plataformas gubernamentales.' : 'Archivo PDF legible (incluye ambos lados cuando aplique).'}"></p>

                <!-- Si aún NO lo ha cargado, mostrar formulario de subida -->
                <form th:if="${doc == null}" method="post" action="/estudiante/servicios/documento" enctype="multipart/form-data" class="form-grid una" style="margin-top:12px">
                    <input type="hidden" name="tipo" th:value="${item}">
                    <label><span>Seleccionar archivo PDF (máx. 10 MB)</span>
                        <input type="file" name="archivo" accept="application/pdf,.pdf" required>
                    </label>
                    <div class="form-actions">
                        <button class="btn" type="submit">↑ Cargar documento definitivo</button>
                    </div>
                </form>

                <!-- Si YA lo cargó, bloquear modificación y mostrar estado -->
                <div th:if="${doc != null}" style="margin-top:auto;padding-top:14px;border-top:1px solid #e2e8f0">
                    <div class="inline" style="justify-content:space-between;margin-bottom:8px">
                        <span class="pill"
                              th:classappend="${doc.estado == 'APROBADO'} ? 'ok' : (${doc.estado == 'RECHAZADO'} ? 'bad' : 'warn')"
                              th:text="${doc.estado}"></span>
                        <small class="muted">🔒 Bloqueado para edición</small>
                    </div>
                    <p style="font-size:13px;font-weight:600;word-break:break-all" th:text="${doc.nombre_archivo}"></p>
                    <p class="muted" style="font-size:12.5px" th:if="${doc.observacion != null and !#strings.isEmpty(doc.observacion)}">
                        <strong>Observación administrativa:</strong> <span th:text="${doc.observacion}"></span>
                    </p>
                    <a class="btn ghost sm" th:href="@{/archivo-privado/documento/{id}(id=${doc.id})}" target="_blank" rel="noopener">
                        📄 Ver documento cargado
                    </a>
                </div>
            </article>
        </section>

        <section class="box" style="margin-top:22px">
            <h3>Fotografía de perfil</h3>
            <form method="post" action="/estudiante/servicios/foto" enctype="multipart/form-data" class="inline">
                <input type="file" name="archivo" accept="image/jpeg,image/png" required style="max-width:360px">
                <button class="btn" type="submit">Actualizar fotografía</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
