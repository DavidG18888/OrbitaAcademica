<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Oferta académica')}"></head><body><div class="app">
<aside th:replace="~{fragments :: side('oferta')}"></aside><main class="main">
<header th:replace="~{fragments :: top('Oferta académica')}"></header><th:block th:replace="~{fragments :: avisos}"></th:block>
<section class="hero"><div><h2>Encuentra tus próximas clases</h2><p>Consulta las secciones activas, sus horarios y los cupos antes de matricularte.</p></div></section>
<section class="box"><div class="scroll"><table class="tabla"><thead><tr><th>Asignatura</th><th>Sección</th><th>Período</th><th>Docente</th><th>Horario</th><th>Cupos</th><th></th></tr></thead><tbody>
<tr th:each="x:${oferta}"><td><b th:text="${x.asignatura}"></b><small th:text="${x.codigo_asignatura}"></small></td><td th:text="${x.seccion}"></td><td th:text="${x.periodo}"></td><td th:text="${x.docente}"></td><td th:text="${x.horario} ?: 'Por definir'"></td>
<td th:text="|${x.inscritos} / ${x.cupo}|"></td><td>
<span class="pill" th:if="${x.ya_matriculado == 1}">Matriculado</span>
<form th:if="${x.ya_matriculado == 0 and x.inscritos < x.cupo}" method="post" th:action="@{/estudiante/oferta/{id}/matricular(id=${x.id})}"><button class="btn" type="submit">Matricularme</button></form>
<span class="muted" th:if="${x.ya_matriculado == 0 and x.inscritos >= x.cupo}">Sin cupos</span>
</td></tr><tr th:if="${oferta.isEmpty()}"><td colspan="7" class="muted">No hay secciones activas disponibles.</td></tr>
</tbody></table></div></section></main></div></body></html>
