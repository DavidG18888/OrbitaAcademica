<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Historial académico')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('historial')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Historial académico')}"></header>

        <section class="stats">
            <article><small>Índice acumulado</small><strong th:text="${indice} ?: '—'"></strong><span>Promedio de asignaturas calificadas</span></article>
            <article><small>UV aprobadas</small><strong th:text="${uvAprobadas}"></strong><span>Unidades valorativas</span></article>
            <article class="no-print"><small>Documento</small>
                <button class="btn" type="button" onclick="window.print()">Imprimir / PDF</button>
                <a class="btn ghost" href="/estudiante/notas.csv">Descargar notas</a></article>
        </section>

        <section class="box" th:each="b : ${historial}">
            <div class="box-head">
                <h3 th:text="${b.periodo}">Período</h3>
                <span class="muted">Promedio <b th:text="${b.promedio} ?: '—'"></b> · <b th:text="${b.uvAprobadas}"></b> UV aprobadas</span>
            </div>
            <div class="scroll">
                <table class="tabla">
                    <thead><tr><th>Código</th><th>Asignatura</th><th>UV</th><th>Promedio</th><th>Estado</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${b.filas}">
                        <td th:text="${r.codigo}"></td><td th:text="${r.asignatura}"></td><td th:text="${r.uv}"></td>
                        <td><strong th:text="${r.promedio} ?: '—'"></strong></td>
                        <td><span class="pill" th:classappend="${r.m_estado == 'ACTIVA'} ? ${r.clase} : 'warn'" th:text="${r.m_estado == 'ACTIVA'} ? ${r.estado} : 'Retirada'"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <p class="muted" th:if="${historial.isEmpty()}">Todavía no tiene historial académico.</p>
    </main>
</div>
</body>
</html>
