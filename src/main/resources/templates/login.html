<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso | Órbita Académica</title><link rel="stylesheet" th:href="@{/css/orbita.css}"></head><body class="login-page"><div class="login-card"><section class="login-brand"><img th:src="@{/img/logo-orbita.png}" alt="Órbita Académica"><h2>Conectando el futuro académico.</h2><p>Una plataforma para organizar y acompañar cada etapa de la vida académica.</p></section><section class="login-form"><span class="eyebrow">GESTIÓN INTEGRAL</span><h1>Bienvenido</h1><p class="muted">Ingrese sus credenciales para continuar.</p><form method="post" action="/login"><label>Usuario<input name="usuario" autocomplete="username" required placeholder="Ingrese su usuario"></label><label>Contraseña<input name="clave" type="password" autocomplete="current-password" required placeholder="Ingrese su contraseña"></label><button class="primary-btn full" type="submit">Ingresar al sistema</button></form><div class="notice error" th:if="${error}" th:text="${error}"></div><footer>Órbita Académica · Gestión Integral</footer></section></div></body></html>
