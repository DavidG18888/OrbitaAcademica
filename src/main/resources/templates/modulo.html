<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title}"></title><link rel="stylesheet" th:href="@{/css/orbita.css}"></head><body><div class="layout"><aside class="sidebar"><div class="brand">✦ ÓRBITA<br><small>ACADÉMICA</small></div><a href="/panel">▦ Dashboard</a><a href="/modulos/estudiantes">Estudiantes</a><a href="/modulos/docentes">Docentes</a><a href="/modulos/asignaturas">Asignaturas</a><a href="/modulos/matriculas">Matrículas</a><a href="/modulos/periodos">Períodos</a><a href="/modulos/horarios">Horarios</a><a href="/modulos/calificaciones">Calificaciones</a><a href="/modulos/asistencia">Asistencia</a><a href="/modulos/usuarios">Usuarios</a><a href="/salir">Cerrar sesión</a></aside><main class="main"><header><div><small>GESTIÓN ACADÉMICA</small><h1 th:text="${title}"></h1></div><div class="user" th:text="${nombre}"></div></header><section class="box"><h2>Agregar registro</h2><form class="crud-form" th:action="@{/modulos/{m}/guardar(m=${mod})}" method="post"><div th:each="c,i : ${cols}"><label th:text="${labels[i.index]}"></label><input th:name="${c}" required></div><button>Guardar</button></form></section><section class="box"><h2>Registros</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th th:each="l : ${labels}" th:text="${l}"></th><th>Acción</th></tr></thead><tbody><tr th:each="row : ${rows}"><td th:text="${row['id']}"></td><td th:each="c : ${cols}" th:text="${row[c]}"></td><td><form th:action="@{/modulos/{m}/eliminar(m=${mod})}" method="post"><input type="hidden" name="id" th:value="${row['id']}"><button class="danger">Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="20">No hay registros aún.</td></tr></tbody></table></div></section><a class="back" href="/panel">← Volver al Dashboard</a></main></div></body></html>
