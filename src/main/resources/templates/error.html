<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | Órbita Académica</title>
    <link rel="stylesheet" th:href="@{/css/orbita.css}">
</head>
<body class="login-body">
<div class="login-card" style="background:white;border-radius:14px;max-width:760px;width:100%;box-shadow:0 18px 55px #16365d16">
    <div class="small-brand">ÓRBITA ACADÉMICA</div>
    <h2>Algo salió mal</h2>
    <p class="muted">No se pudo mostrar la página <b th:text="${path}">/ruta</b> (código <span th:text="${status}">500</span>).</p>
    <div class="error" th:if="${message != null and !message.isEmpty()}" style="word-break:break-word">
        <span th:if="${exception != null}" th:text="${exception} + ': '"></span><span th:text="${message}"></span>
    </div>
    <p class="muted">Si el mensaje indica que falta una tabla o columna, revise la configuración de Turso y el archivo de migración de base de datos incluido en el proyecto.</p>
    <p><a class="btn" href="/panel" style="display:inline-block;width:auto;text-decoration:none;padding:12px 20px">Volver al inicio</a></p>
</div>
</body>
</html>
