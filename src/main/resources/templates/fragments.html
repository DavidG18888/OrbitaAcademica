<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(t)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${t} + ' | Órbita Académica'">Órbita Académica</title>
    <link rel="stylesheet" th:href="@{/css/orbita.css}">
</head>
<body>

<aside class="sidebar" th:fragment="side(slug)">
    <img th:src="@{/img/logo-orbita.png}" class="side-logo" alt="Órbita Académica">

    <th:block th:if="${session.rol == 'ADMIN'}">
        <div class="nav-title">GENERAL</div>
        <a th:classappend="${slug == 'panel'} ? 'active'" href="/panel">▦ Dashboard</a>
        <div class="nav-title">GESTIÓN ACADÉMICA</div>
        <a th:classappend="${slug == 'estudiantes'} ? 'active'" href="/admin/estudiantes">♙ Estudiantes</a>
        <a th:classappend="${slug == 'docentes'} ? 'active'" href="/admin/docentes">♧ Docentes</a>
        <a th:classappend="${slug == 'carreras'} ? 'active'" href="/admin/carreras">◈ Carreras</a>
        <a th:classappend="${slug == 'asignaturas'} ? 'active'" href="/admin/asignaturas">▤ Asignaturas</a>
        <a th:classappend="${slug == 'periodos'} ? 'active'" href="/admin/periodos">◷ Períodos</a>
        <a th:classappend="${slug == 'secciones'} ? 'active'" href="/admin/secciones">▥ Secciones y horarios</a>
        <a th:classappend="${slug == 'matriculas'} ? 'active'" href="/admin/matriculas">▣ Matrículas</a>
    </th:block>

    <th:block th:if="${session.rol == 'DOCENTE'}">
        <div class="nav-title">DOCENTE</div>
        <a class="active" href="/docente">▤ Mis secciones</a>
    </th:block>

    <th:block th:if="${session.rol == 'ESTUDIANTE'}">
        <div class="nav-title">ESTUDIANTE</div>
        <a class="active" href="/estudiante">✓ Mis asignaturas y notas</a>
    </th:block>

    <div class="nav-title">SISTEMA</div>
    <a href="/salir">↪ Cerrar sesión</a>
</aside>

<header th:fragment="top(t)">
    <div>
        <p class="eyebrow">ÓRBITA ACADÉMICA</p>
        <h1 th:text="${t}">Título</h1>
    </div>
    <div class="user">
        <span th:text="${session.nombre}">Usuario</span>
        <small th:text="${session.rol}">ROL</small>
    </div>
</header>

<th:block th:fragment="avisos">
    <div class="flash ok" th:if="${ok}" th:text="${ok}"></div>
    <div class="flash err" th:if="${error}" th:text="${error}"></div>
</th:block>

</body>
</html>
