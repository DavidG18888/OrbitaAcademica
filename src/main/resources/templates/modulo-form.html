<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario | Órbita Académica</title><link rel="stylesheet" th:href="@{/css/orbita.css}"></head><body><div class="app"><aside class="sidebar"><img th:src="@{/img/logo-orbita.png}" class="side-logo" alt="Órbita Académica"><a href="/panel">Dashboard</a><div class="nav-title">MÓDULOS</div><a href="/modulos/estudiantes">Estudiantes</a><a href="/modulos/docentes">Docentes</a><a href="/modulos/carreras">Carreras</a><a href="/modulos/asignaturas">Asignaturas</a><a href="/modulos/matriculas">Matrículas</a><a href="/modulos/periodos">Períodos</a><a href="/modulos/horarios">Horarios</a><a href="/modulos/calificaciones">Calificaciones</a><a href="/modulos/asistencias">Asistencia</a><a href="/modulos/usuarios">Usuarios</a><a href="/salir">Cerrar sesión</a></aside><main class="main"><header><div><p class="eyebrow">FORMULARIO</p><h1 th:text="${modo == 'nuevo' ? 'Nuevo registro' : 'Editar registro'}">Formulario</h1><p class="muted" th:text="${titulo}">Módulo</p></div></header><section class="box form-box"><form method="post" th:action="@{'/modulos/'+${slug}+'/guardar'}"><input type="hidden" name="id" th:value="${registro['id']}"><div class="form-grid"><div class="field" th:each="campo : ${campos}"><label th:for="${campo.nombre}" th:text="${campo.etiqueta}">Campo</label><textarea th:if="${campo.tipo == 'textarea'}" th:id="${campo.nombre}" th:name="${campo.nombre}" th:text="${registro[campo.nombre]}"></textarea><select th:if="${campo.tipo == 'select'}" th:id="${campo.nombre}" th:name="${campo.nombre}"><option value="">Seleccione</option><option th:if="${campo.nombre == 'estado'}" value="ACTIVO" th:selected="${registro[campo.nombre] == 'ACTIVO'}">Activo</option><option th:if="${campo.nombre == 'estado'}" value="INACTIVO" th:selected="${registro[campo.nombre] == 'INACTIVO'}">Inactivo</option><option th:if="${campo.nombre == 'estado'}" value="PENDIENTE" th:selected="${registro[campo.nombre] == 'PENDIENTE'}">Pendiente</option><option th:if="${campo.nombre == 'estado'}" value="APROBADO" th:selected="${registro[campo.nombre] == 'APROBADO'}">Aprobado</option><option th:if="${campo.nombre == 'estado'}" value="REPROBADO" th:selected="${registro[campo.nombre] == 'REPROBADO'}">Reprobado</option><option th:if="${campo.nombre == 'estado'}" value="PRESENTE" th:selected="${registro[campo.nombre] == 'PRESENTE'}">Presente</option><option th:if="${campo.nombre == 'estado'}" value="AUSENTE" th:selected="${registro[campo.nombre] == 'AUSENTE'}">Ausente</option><option th:if="${campo.nombre == 'estado'}" value="JUSTIFICADO" th:selected="${registro[campo.nombre] == 'JUSTIFICADO'}">Justificado</option><option th:if="${campo.nombre == 'rol'}" value="ADMIN" th:selected="${registro[campo.nombre] == 'ADMIN'}">Administrador</option><option th:if="${campo.nombre == 'rol'}" value="DOCENTE" th:selected="${registro[campo.nombre] == 'DOCENTE'}">Docente</option><option th:if="${campo.nombre == 'rol'}" value="ESTUDIANTE" th:selected="${registro[campo.nombre] == 'ESTUDIANTE'}">Estudiante</option><option th:if="${campo.nombre == 'dia'}" value="LUNES">Lunes</option><option th:if="${campo.nombre == 'dia'}" value="MARTES">Martes</option><option th:if="${campo.nombre == 'dia'}" value="MIERCOLES">Miércoles</option><option th:if="${campo.nombre == 'dia'}" value="JUEVES">Jueves</option><option th:if="${campo.nombre == 'dia'}" value="VIERNES">Viernes</option><option th:if="${campo.nombre == 'dia'}" value="SABADO">Sábado</option></select><input th:unless="${campo.tipo == 'textarea' or campo.tipo == 'select'}" th:type="${campo.tipo}" th:id="${campo.nombre}" th:name="${campo.nombre}" th:value="${registro[campo.nombre]}" th:required="${campo.nombre == 'clave' ? modo == 'nuevo' : campo.nombre != 'observacion' and campo.nombre != 'descripcion' and campo.nombre != 'usuario_id'}" th:placeholder="${campo.tipo == 'password' and modo == 'editar' ? 'Dejar vacío para conservar' : ''}"><small th:if="${campo.nombre == 'clave' and modo == 'editar'}">Deje este campo vacío para conservar la contraseña actual.</small></div></div><div class="form-actions"><a class="secondary-btn" th:href="@{'/modulos/'+${slug}}">Cancelar</a><button class="primary-btn" type="submit">Guardar</button></div></form></section></main></div></body></html>
