<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${modo == 'nuevo' ? 'Nuevo registro' : 'Editar registro'}+' | Órbita Académica'">Formulario</title><link rel="stylesheet" th:href="@{/css/orbita.css}"></head><body><div class="app"><aside class="sidebar"><img class="side-logo" th:src="@{/img/logo-orbita.png}" alt="Logo"><a href="/panel">▦ Dashboard</a><div class="nav-title">GESTIÓN ACADÉMICA</div><a href="/modulos/estudiantes">Estudiantes</a><a href="/modulos/docentes">Docentes</a><a href="/modulos/carreras">Carreras</a><a href="/modulos/asignaturas">Asignaturas</a><a href="/modulos/matriculas">Matrículas</a><a href="/modulos/periodos">Períodos</a><a href="/modulos/horarios">Horarios</a><div class="nav-title">EVALUACIÓN</div><a href="/modulos/calificaciones">Calificaciones</a><a href="/modulos/asistencias">Asistencia</a><div class="nav-title">SISTEMA</div><a th:if="${rol == 'ADMIN'}" href="/modulos/usuarios">Usuarios</a><a href="/salir">Cerrar sesión</a></aside><main class="main"><header><div><p class="eyebrow" th:text="${titulo}">Módulo</p><h1 th:text="${modo == 'nuevo' ? 'Nuevo '+singular : 'Editar '+singular}">Formulario</h1></div><a class="secondary-btn" th:href="@{/modulos/{s}(s=${slug})}">← Volver</a></header><section class="box form-box"><form method="post" th:action="@{/modulos/{s}/guardar(s=${slug})}"><input type="hidden" name="id" th:value="${registro['id']}"><div class="form-grid"><div class="field" th:each="campo:${campos}"><label th:for="${campo.name}" th:text="${campo.label}">Campo</label><div th:if="${campo.type == 'textarea'}"><textarea th:id="${campo.name}" th:name="${campo.name}" th:text="${registro[campo.name]}"></textarea></div><div th:if="${campo.type == 'select'}"><select th:id="${campo.name}" th:name="${campo.name}" required><option value="">Seleccione...</option><option th:if="${campo.name == 'estado'}" value="ACTIVO" th:selected="${registro[campo.name] == 'ACTIVO'}">Activo</option><option th:if="${campo.name == 'estado'}" value="INACTIVO" th:selected="${registro[campo.name] == 'INACTIVO'}">Inactivo</option><option th:if="${campo.name == 'estado' && slug == 'asistencias'}" value="PRESENTE" th:selected="${registro[campo.name] == 'PRESENTE'}">Presente</option><option th:if="${campo.name == 'estado' && slug == 'asistencias'}" value="AUSENTE" th:selected="${registro[campo.name] == 'AUSENTE'}">Ausente</option><option th:if="${campo.name == 'estado' && slug == 'asistencias'}" value="TARDANZA" th:selected="${registro[campo.name] == 'TARDANZA'}">Tardanza</option><option th:if="${campo.name == 'rol'}" value="ADMIN" th:selected="${registro[campo.name] == 'ADMIN'}">Administrador</option><option th:if="${campo.name == 'rol'}" value="DOCENTE" th:selected="${registro[campo.name] == 'DOCENTE'}">Docente</option><option th:if="${campo.name == 'rol'}" value="ESTUDIANTE" th:selected="${registro[campo.name] == 'ESTUDIANTE'}">Estudiante</option><option th:if="${campo.name == 'dia'}" value="LUNES" th:selected="${registro[campo.name] == 'LUNES'}">Lunes</option><option th:if="${campo.name == 'dia'}" value="MARTES" th:selected="${registro[campo.name] == 'MARTES'}">Martes</option><option th:if="${campo.name == 'dia'}" value="MIERCOLES" th:selected="${registro[campo.name] == 'MIERCOLES'}">Miércoles</option><option th:if="${campo.name == 'dia'}" value="JUEVES" th:selected="${registro[campo.name] == 'JUEVES'}">Jueves</option><option th:if="${campo.name == 'dia'}" value="VIERNES" th:selected="${registro[campo.name] == 'VIERNES'}">Viernes</option><option th:if="${campo.name == 'dia'}" value="SABADO" th:selected="${registro[campo.name] == 'SABADO'}">Sábado</option></select></div><input th:if="${campo.type != 'textarea' && campo.type != 'select'}" th:id="${campo.name}" th:name="${campo.name}" th:type="${campo.type}" th:value="${registro[campo.name]}" th:required="${campo.name != 'clave' || modo == 'nuevo'}" th:placeholder="${campo.name == 'clave' ? 'Dejar vacío para conservar la contraseña' : ''}"/><small th:if="${campo.name == 'clave' && modo == 'editar'}">Deje vacío si no desea cambiar la contraseña.</small></div></div><div class="form-actions"><a class="secondary-btn" th:href="@{/modulos/{s}(s=${slug})}">Cancelar</a><button class="primary-btn" type="submit">Guardar registro</button></div></form></section><footer class="page-footer">Órbita Académica · Gestión Integral</footer></main></div></body></html>
