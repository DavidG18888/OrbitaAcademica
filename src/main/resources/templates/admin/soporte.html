<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Soporte institucional')}"></head><body><div class="app"><aside th:replace="~{fragments :: side('soporte')}"></aside><main class="main"><header th:replace="~{fragments :: top('Soporte y seguimiento')}"></header><th:block th:replace="~{fragments :: avisos}"></th:block><section class="hero"><div><h2>Atención institucional</h2><p>Tickets, ausencias, eventos y seguimiento académico.</p></div></section><section class="box"><h3>Tickets de estudiantes</h3><article th:each="t:${tickets}" class="subcard"><b th:text="${t.asunto+' · '+t.estudiante}"></b><p th:text="${t.descripcion}"></p><small th:text="${t.estado}"></small><div th:each="r:${t.respuestas}"><small th:text="${r.usuario}"></small><p th:text="${r.mensaje}"></p></div><form method="post" th:action="@{/admin/servicios/ticket/{id}/respuesta(id=${t.id})}" class="form-grid"><input name="mensaje" placeholder="Respuesta" required><select name="estado"><option>EN_PROCESO</option><option>ESPERANDO_ESTUDIANTE</option><option>CERRADO</option></select><button class="btn">Responder</button></form></article><p th:if="${tickets.isEmpty()}" class="muted">No hay tickets abiertos.</p></section><section class="box"><h3>Revisión de estudiantes ausentes</h3><article th:each="a:${ausencias}" class="subcard"><b th:text="${a.estudiante+' · '+a.asignatura+' · '+a.seccion}"></b><p th:text="${a.motivo}"></p><small th:text="${'Intentos: '+a.intentos_contacto+' · '+a.estado_revision}"></small><form method="post" th:action="@{/admin/servicios/ausencia/{id}/contacto(id=${a.id})}" class="form-grid"><select name="medio"><option>Teléfono</option><option>Correo</option><option>WhatsApp</option></select><input name="resultado" placeholder="Resultado del contacto" required><input name="observacion" placeholder="Observación"><button class="btn">Registrar contacto</button></form><form method="post" th:action="@{/admin/servicios/ausencia/{id}/resolver(id=${a.id})}" class="inline"><button name="decision" value="CONFIRMADA">Confirmar no presentado</button><button class="neutro" name="decision" value="DESCARTADA">Descartar</button></form></article></section><section class="box"><h3>Calendario institucional</h3><form method="post" action="/admin/servicios/evento" class="form-grid"><label><span>Evento</span><input name="titulo" required></label><label><span>Inicio</span><input type="datetime-local" name="inicio" required></label><label><span>Fin</span><input type="datetime-local" name="fin"></label><label><span>Lugar</span><input name="lugar"></label><label class="wide"><span>Descripción</span><textarea name="descripcion"></textarea></label><button class="btn">Crear evento</button></form><div th:each="ev:${eventos}" class="subcard"><b th:text="${ev.titulo}"></b><p th:text="${ev.fecha_inicio}"></p></div></section><section class="box"><h3>Lista de espera</h3><div th:each="w:${waitlist}" class="subcard"><b th:text="${w.estudiante+' · '+w.asignatura+' · '+w.seccion}"></b><p th:text="${'Posición '+w.posicion+' · '+w.estado}"></p><form method="post" th:action="@{/admin/servicios/espera/{id}/estado(id=${w.id})}"><select name="estado"><option>ESPERA</option><option>NOTIFICADO</option><option>MATRICULADO</option><option>CANCELADO</option></select><button class="neutro">Actualizar</button></form></div></section><section class="box"><h3>Evaluación docente (resultados agrupados)</h3><div th:each="e:${evaluaciones}" class="subcard"><b th:text="${e.docente+' · '+e.asignatura+' · '+e.seccion}"></b><p th:text="${'Promedio: '+e.promedio+' / 5 · Respuestas: '+e.respuestas}"></p></div></section><section class="box"><h3>Bitácora de actividad</h3><div th:each="b:${bitacora}" class="subcard"><b th:text="${b.accion}"></b><p th:text="${b.usuario+' · '+b.entidad+' · '+b.creada_en}"></p></div></section></main></div></body></html>
