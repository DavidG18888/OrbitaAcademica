<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Expedientes')}"></head><body><div class="app"><aside th:replace="~{fragments :: side('expedientes')}"></aside><main class="main"><header th:replace="~{fragments :: top('Expedientes digitales')}"></header><th:block th:replace="~{fragments :: avisos}"></th:block><section class="hero"><div><h2>Revisión de documentos</h2><p>Revisa cada archivo y registra aprobación o motivo de rechazo.</p></div></section><section class="box"><h3>Documentos pendientes</h3><article th:each="d:${documentos}" class="subcard"><b th:text="${d.estudiante+' · '+d.tipo}"></b><p th:text="${d.nombre_archivo}"></p><a th:href="@{/archivo-privado/documento/{id}(id=${d.id})}">Abrir documento</a><form method="post" th:action="@{/admin/servicios/documento/{id}/revisar(id=${d.id})}" class="form-grid"><select name="estado"><option value="APROBADO">Aprobar</option><option value="RECHAZADO">Rechazar</option><option value="EN_REVISION">Mantener en revisión</option></select><input name="observacion" placeholder="Observación o motivo"><button class="btn">Guardar revisión</button></form></article><p th:if="${documentos.isEmpty()}" class="muted">No hay documentos pendientes de revisión.</p></section></main></div></body></html>
