<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${titulo})}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side(${slug})}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top(${titulo})}"></header>
        <th:block th:replace="~{fragments :: avisos}"></th:block>

        <section class="box">
            <h3 th:text="${form != null} ? 'Editar registro' : 'Nuevo registro'">Nuevo registro</h3>
            <form method="post" th:action="@{/admin/{e}/guardar(e=${slug})}" class="form-grid">
                <input type="hidden" name="id" th:value="${form != null} ? ${form.get('id')}">
                <label th:each="c : ${campos}">
                    <span th:text="${c.label()}">Campo</span>
                    <select th:if="${c.tipo() == 'sel'}" th:name="${c.n()}" required>
                        <option value="">Seleccione</option>
                        <option th:each="o : ${ops.get(c.n())}" th:value="${o.get('id')}" th:text="${o.get('nombre')}"
                                th:selected="${form != null and form.get(c.n()) == o.get('id')}"></option>
                    </select>
                    <select th:if="${c.tipo() == 'estado'}" th:name="${c.n()}">
                        <option th:each="v : ${ {'ACTIVO','INACTIVO'} }" th:value="${v}" th:text="${v}"
                                th:selected="${form != null and form.get(c.n()) == v}"></option>
                    </select>
                    <select th:if="${c.tipo() == 'dia'}" th:name="${c.n()}">
                        <option value="">Seleccione</option>
                        <option th:each="v : ${ {'Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'} }" th:value="${v}" th:text="${v}"
                                th:selected="${form != null and form.get(c.n()) == v}"></option>
                    </select>
                    <input th:if="${c.tipo() != 'sel' and c.tipo() != 'estado' and c.tipo() != 'dia'}" th:type="${c.tipo()}" th:name="${c.n()}"
                           th:value="${form != null} ? ${form.get(c.n())}">
                </label>
                <div class="form-actions">
                    <button class="btn" type="submit">Guardar</button>
                    <a class="btn ghost" th:if="${form != null}" th:href="@{/admin/{e}(e=${slug})}">Cancelar</a>
                </div>
            </form>
        </section>

        <section class="box">
            <h3>Registros</h3>
            <div class="scroll">
                <table class="tabla">
                    <thead><tr><th th:each="c : ${cols}" th:text="${c}"></th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="f : ${filas}">
                        <td th:each="c : ${cols}" th:text="${f.get(c)}"></td>
                        <td class="acc">
                            <a th:if="${slug != 'matriculas'}" th:href="@{/admin/{e}/{id}/editar(e=${slug},id=${f.get('id')})}">Editar</a>
                            <form method="post" th:action="@{/admin/{e}/{id}/eliminar(e=${slug},id=${f.get('id')})}"
                                  onsubmit="return confirm('¿Eliminar este registro?')">
                                <button type="submit">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${filas.isEmpty()}"><td class="muted">Aún no hay registros.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
