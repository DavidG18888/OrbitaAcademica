<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mi cuenta')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('cuenta')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Datos personales')}"></header>
        <th:block th:replace="~{fragments :: avisos}"></th:block>

        <section class="content-grid">
            <article class="box">
                <h3>Mi información</h3>
                <dl class="datos">
                    <th:block th:each="d : ${datos}"><dt th:text="${d.key}"></dt><dd th:text="${d.value} ?: '—'"></dd></th:block>
                </dl>
                <form method="post" th:action="${base} + '/cuenta/contacto'" class="form-grid">
                    <label><span>Correo</span><input type="email" name="correo" th:value="${correo}"></label>
                    <label><span>Teléfono</span><input type="text" name="telefono" th:value="${telefono}"></label>
                    <div class="form-actions"><button class="btn" type="submit">Guardar contacto</button></div>
                </form>
                <p class="muted">Para corregir nombre, código o carrera, comuníquese con la administración.</p>
            </article>
            <article class="box">
                <h3>Cambiar contraseña</h3>
                <form method="post" th:action="${base} + '/cuenta/clave'" class="form-grid una">
                    <label><span>Contraseña actual</span><input type="password" name="actual" required autocomplete="current-password"></label>
                    <label><span>Nueva contraseña (mínimo 8 caracteres)</span><input type="password" name="nueva" required minlength="8" autocomplete="new-password"></label>
                    <label><span>Confirmar nueva contraseña</span><input type="password" name="confirmar" required minlength="8" autocomplete="new-password"></label>
                    <div class="form-actions"><button class="btn" type="submit">Actualizar contraseña</button></div>
                </form>
            </article>
        </section>
    </main>
</div>
</body>
</html>
