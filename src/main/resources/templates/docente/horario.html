<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Horario')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('horario')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Mi horario semanal')}"></header>
        <div th:replace="~{fragments :: semana(${semana})}"></div>
        <section class="box" style="margin-top:20px" th:if="${!fechasEspeciales.isEmpty()}">
            <h3>Clases en fechas específicas</h3>
            <div class="scroll"><table class="tabla"><thead><tr><th>Fecha</th><th>Asignatura</th><th>Horario</th><th>Aula</th><th>Sección</th></tr></thead><tbody>
            <tr th:each="f : ${fechasEspeciales}"><td th:text="${f.fecha}"></td><td th:text="${f.asignatura}"></td><td th:text="|${f.hora_inicio} – ${f.hora_fin}|"></td><td th:text="${f.aula}"></td><td th:text="${f.seccion}"></td></tr>
            </tbody></table></div>
        </section>
    </main>
</div>
</body>
</html>
