<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Reporte de notas')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('secciones')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top(${sec.titulo})}"></header>
        <nav th:replace="~{fragments :: tabs(${sec.id}, 'reporte')}"></nav>

        <section class="stats">
            <article><small>Promedio de la sección</small><strong th:text="${rep.media} ?: '—'"></strong><span th:text="${rep.calificados} + ' de ' + ${rep.total} + ' con notas completas'"></span></article>
            <article><small>Aprobados</small><strong th:text="${rep.aprobados}"></strong><span th:text="${rep.pctAprob} + '% de los calificados'"></span></article>
            <article><small>Reprobados</small><strong th:text="${rep.reprobados}"></strong><span>Promedio menor a 70</span></article>
            <article><small>Mayor / menor</small><strong th:text="${rep.max} != null ? ${rep.max} + ' / ' + ${rep.min} : '—'"></strong><span>Promedios extremos</span></article>
        </section>

        <section class="box">
            <h3>Distribución de promedios</h3>
            <div class="dist">
                <div th:each="l, i : ${ {'0–64','65–79','80–89','90–100'} }">
                    <i th:style="'height:' + (${rep.dist[i.index]} * 100 / ${rep.distMax}) + '%'" th:classappend="${i.index == 0} ? 'bad'"></i>
                    <b th:text="${rep.dist[i.index]}"></b><small th:text="${l}"></small>
                </div>
            </div>
        </section>

        <section class="box">
            <div class="box-head">
                <h3>Detalle por estudiante</h3>
                <div class="no-print">
                    <a class="btn" target="_blank" th:href="@{/docente/seccion/{id}/reporte/imprimir(id=${sec.id})}">Imprimir reporte con Jasper</a>
                </div>
            </div>
            <div class="scroll">
                <table class="tabla">
                    <thead><tr><th>Código</th><th>Estudiante</th><th>P1</th><th>P2</th><th>P3</th><th>Promedio</th><th>Estado</th><th>Asistencia</th></tr></thead>
                    <tbody>
                    <tr th:each="a : ${alumnos}">
                        <td th:text="${a.codigo}"></td><td th:text="${a.nombre}"></td>
                        <td th:text="${a.parcial1} ?: '—'"></td><td th:text="${a.parcial2} ?: '—'"></td><td th:text="${a.parcial3} ?: '—'"></td>
                        <td><strong th:text="${a.promedio} ?: '—'"></strong></td>
                        <td><span class="pill" th:classappend="${a.clase}" th:text="${a.estado}"></span></td>
                        <td th:text="${a.asist != null} ? ${a.asist} + '%' : '—'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
</body>
</html>
