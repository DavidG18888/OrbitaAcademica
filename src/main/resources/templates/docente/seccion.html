<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Calificaciones')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('secciones')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top(${sec.titulo})}"></header>
        <nav th:replace="~{fragments :: tabs(${sec.id}, 'notas')}"></nav>
        <th:block th:replace="~{fragments :: avisos}"></th:block>
        <section class="box">
            <form method="post" th:action="@{/docente/seccion/{id}/notas(id=${sec.id})}">
                <div class="scroll">
                    <table class="tabla" id="notas">
                        <thead><tr><th>Código</th><th>Estudiante</th><th>Parcial 1</th><th>Parcial 2</th><th>Parcial 3</th><th>Promedio</th></tr></thead>
                        <tbody>
                        <tr th:each="a : ${alumnos}">
                            <td th:text="${a.codigo}"></td>
                            <td th:text="${a.nombre}"></td>
                            <td><input class="nota" type="number" min="0" max="100" step="0.1" th:name="'p1_' + ${a.matricula}" th:value="${a.parcial1}"></td>
                            <td><input class="nota" type="number" min="0" max="100" step="0.1" th:name="'p2_' + ${a.matricula}" th:value="${a.parcial2}"></td>
                            <td><input class="nota" type="number" min="0" max="100" step="0.1" th:name="'p3_' + ${a.matricula}" th:value="${a.parcial3}"></td>
                            <td><span class="pill prom" th:classappend="${a.clase}" th:text="${a.promedio} ?: '—'"></span></td>
                        </tr>
                        <tr th:if="${alumnos.isEmpty()}"><td class="muted">No hay estudiantes matriculados.</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="form-actions"><button class="btn" type="submit">Guardar calificaciones</button></div>
            </form>
        </section>
    </main>
</div>
<script>
document.querySelectorAll('#notas tbody tr').forEach(function (tr) {
    var inp = tr.querySelectorAll('input.nota'), pill = tr.querySelector('.prom');
    if (!pill) return;
    inp.forEach(function (i) {
        i.addEventListener('input', function () {
            var v = Array.from(inp).map(function (x) { return parseFloat(x.value); });
            if (v.some(isNaN)) { pill.textContent = '—'; pill.className = 'pill prom neutral'; return; }
            var p = Math.round((v[0] + v[1] + v[2]) / 3 * 10) / 10;
            pill.textContent = p; pill.className = 'pill prom ' + (p >= 65 ? 'ok' : 'bad');
        });
    });
});
</script>
</body>
</html>
