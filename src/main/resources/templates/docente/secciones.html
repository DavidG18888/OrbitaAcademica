<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mis secciones')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side('secciones')}"></aside>
    <main class="main">
        <header th:replace="~{fragments :: top('Mis secciones')}"></header>
        <div class="cards">
            <article class="card" th:each="s : ${secciones}">
                <small th:text="${s.codigo} + ' · ' + ${s.seccion}"></small>
                <h3 th:text="${s.asignatura}"></h3>
                <p class="muted" th:text="${s.periodo} + ' · ' + ${s.horario} + ' · ' + (${s.aula} ?: 'Aula por definir')"></p>
                <div class="barra"><i th:style="'width:' + ${s.ocup} + '%'"></i></div>
                <p class="muted"><span th:text="${s.inscritos}"></span> estudiantes<span th:if="${s.cupo != null}"> de <span th:text="${s.cupo}"></span> cupos</span></p>
                <div class="card-actions">
                    <a class="btn" th:href="@{/docente/seccion/{id}(id=${s.id})}">Notas</a>
                    <a class="btn ghost" th:href="@{/docente/seccion/{id}/asistencia(id=${s.id})}">Asistencia</a>
                    <a class="btn ghost" th:href="@{/docente/seccion/{id}/reporte(id=${s.id})}">Reporte</a>
                </div>
            </article>
        </div>
        <p class="muted" th:if="${secciones.isEmpty()}">Aún no tiene secciones asignadas.</p>
    </main>
</div>
</body>
</html>
