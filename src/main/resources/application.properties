spring.application.name=OrbitaAcademica
server.port=${PORT:8080}
spring.thymeleaf.cache=true

server.error.include-message=${ERRORES_DETALLE:always}
server.error.include-exception=true
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Archivos privados: en Render configurar ORBITA_STORAGE_PATH sobre un Persistent Disk.
orbita.storage.path=${ORBITA_STORAGE_PATH:./private-uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=18MB
